<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pflanzenlernen · Beispiel</title><link rel="stylesheet" href="../assets/font.css"><style>*{box-sizing:border-box}body{margin:0;background:#f7f8f1;color:#28382c;font:18px 'DM Sans',Arial,sans-serif}header{display:flex;justify-content:space-between;align-items:center;padding:24px 38px;border-bottom:1px solid #dce1d5}header b{font-size:22px;letter-spacing:-.7px}header small{font-size:12px;color:#748170;letter-spacing:1.4px}main{padding:35px 38px}h1{font-size:39px;font-weight:500;letter-spacing:-1.7px;margin:0 0 6px}p{margin:0 0 24px;color:#7f8b78;font-size:16px}input{width:100%;padding:16px 20px;border:1px solid #cdd7c4;border-radius:10px;background:#fff;font:17px 'DM Sans';outline:none}input:focus{border-color:#819971;box-shadow:0 0 0 3px #dfe8d6}.result-meta{display:flex;justify-content:space-between;margin:20px 0 13px;color:#7c8774;font-size:13px}article{background:#fff;border:1px solid #dce3d2;border-radius:12px;padding:22px 24px;display:flex;align-items:center;justify-content:space-between}article h2{font-size:26px;letter-spacing:-.6px;font-weight:500;margin:0 0 5px}article p{font-size:17px;margin:0;color:#7b8774}article span{font-size:12px;border:1px solid #dce5d2;border-radius:20px;padding:7px 12px;color:#678057}.empty{height:116px;display:grid;place-content:center;text-align:center;border:1px dashed #cdd6c1;border-radius:10px;color:#8b9582;font-size:20px}.empty small{font-size:13px;margin-top:8px}footer{padding:18px 38px;color:#96a08e;font-size:12px}button{font:inherit;cursor:pointer;border:1px solid #bacbb0;background:#e5eddd;color:#53694a;border-radius:8px;padding:6px 10px;font-size:12px}</style></head><body><header><b>pflanzenlernen</b><small>DEMO / PFLANZENLISTE</small></header><main><h1>Was wächst hier?</h1><p>Deine Pflanzenliste zum Nachschlagen und Lernen.</p><input aria-label="Pflanzensuche" placeholder="Deutscher oder botanischer Name" value="Eiche"><div class="result-meta"><span id="count"></span><span>Gehölze</span></div><div id="results"></div></main><footer>Beispiel für die Präsentation <button id="version" style="float:right"></button></footer><script>let before=new URLSearchParams(location.search).has('before');const plants=[['Quercus robur','Stiel-Eiche'],['Fagus sylvatica','Rotbuche'],['Acer campestre','Feld-Ahorn']];const input=document.querySelector('input');function render(){const q=input.value.toLocaleLowerCase('de');const result=plants.filter(p=>(before?p[0]:p.join(' ')).toLocaleLowerCase('de').includes(q));document.querySelector('#count').textContent=result.length+' Treffer';document.querySelector('#version').textContent=before?'Version 1':'Version 2';document.querySelector('#results').innerHTML=result.length?result.map(p=>'<article><div><h2>'+p[0]+'</h2><p>'+p[1]+'</p></div><span>Laubgehölz</span></article>').join(''):'<div class="empty">Keine Pflanzen gefunden<small>Versuche einen anderen Suchbegriff.</small></div>'}input.addEventListener('input',render);document.querySelector('#version').onclick=()=>{before=!before;render()};render();</script></body></html>
