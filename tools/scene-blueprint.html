<!doctype html>
<meta charset="utf-8">
<title>Motiv: Wasserringe</title>
<!-- Prozedural erzeugtes Kapitelmotiv „Wasserringe“: Wellenringe auf dunklem, stillem Wasser, direkt von oben gesehen. Von einem Punkt unter dem Bild laufen die Ringe nach außen; darüber bleibt die Wasserfläche ruhig und leer. Kein Horizont: Beim Drehen wandern nur die Glanzpunkte auf den Wellenkämmen. Ersetzt das frühere KI-Bild. Parameter: ?seed=5&scale=2&q=.86. Rendern: node tools/render-scene.mjs blueprint -->
<style>html,body{margin:0;background:#000}canvas{display:block;max-width:100vw;height:auto}</style>
<canvas id="c"></canvas>
<script>
const params=new URLSearchParams(location.search),seed=+params.get('seed')||5,scale=+params.get('scale')||2,quality=+params.get('q')||.86;
const W=1600*scale,H=900*scale,u=scale,canvas=document.getElementById('c');canvas.width=W;canvas.height=H;const ctx=canvas.getContext('2d');
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry32(seed),TAU=Math.PI*2;
/* Ringe: Zentrum unter dem Bild (motion.js dreht um genau diesen Punkt), vorderster Ring bei FRONT */
const C={x:800,y:1500},FRONT=960,INNER=560;
const smooth=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};
const hash=(x,y,s)=>{let h=(Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(s+seed,1103515245))|0;h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296};
function vnoise(x,y,s=3){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy,sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy),a=hash(ix,iy,s),b=hash(ix+1,iy,s),c=hash(ix,iy+1,s),d=hash(ix+1,iy+1,s);return a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy}
const fbm=(x,y,s=3)=>{let v=0,a=.5,f=1;for(let o=0;o<4;o++){v+=vnoise(x*f,y*f,s+o)*a;f*=2.03;a*=.5}return v/.9375};
/* Licht von links oben, Blick senkrecht von oben */
const L=(()=>{const v=[-.45,-.62,.64],n=Math.hypot(...v);return v.map(c=>c/n)})(),Hv=(()=>{const v=[L[0],L[1],L[2]+1],n=Math.hypot(...v);return v.map(c=>c/n)})();
const img=ctx.createImageData(W,H),px=img.data;
for(let j=0;j<H;j++){const y=(j+.5)/u;for(let i=0;i<W;i++){const x=(i+.5)/u,k=(j*W+i)*4,dx=x-C.x,dy=y-C.y,r=Math.hypot(dx,dy),a=Math.atan2(dy,dx);
 /* Wellenpaket: vorne kräftig, nach innen abklingend, leicht zunehmende Wellenlänge (Dispersion) */
 const env=smooth(FRONT+10,FRONT-34,r)*smooth(INNER-120,INNER+160,r)*(.45+.55*smooth(INNER,FRONT,r)),lam=23+.045*(FRONT-r),ph=TAU*(FRONT-r)/lam,wob=1+.25*(fbm(a*14,r*.01,7)-.5);
 const slope=env*wob*Math.cos(ph)*TAU/lam*3.4,nx=-slope*dx/r*.5,ny=-slope*dy/r*.5,nz=1,nn=Math.hypot(nx,ny,nz),N=[nx/nn,ny/nn,nz/nn];
 /* feine Kräuselung auf der ganzen Fläche, damit das stille Wasser nicht leblos wirkt */
 const f=(fbm(x/9,y/9,11)-.5)*.05,g2=(fbm(x/42,y/42,13)-.5);
 const diff=N[0]*L[0]+N[1]*L[1]+N[2]*L[2],spec=Math.pow(Math.max(0,N[0]*Hv[0]+N[1]*Hv[1]+N[2]*Hv[2]),70);
 /* Glanzpunkte nur hier und da auf den Kämmen: Rauschen entlang des Umfangs bricht die Symmetrie */
 const sparkle=spec*env*smooth(.6,.78,vnoise(x/3.4,y/3.4,17))*smooth(.35,.7,vnoise(x/40,y/40,19))*1.6;
 /* Grundfarbe: tiefes Blaugrün, oben etwas heller (Himmelsspiegelung), in den Ringen leicht aufgehellt */
 const sky=.12*(1-y/900)+.05*g2+f,base=[16+30*sky,34+44*sky,46+54*sky],lift=env*.8;
 const shade=(diff-L[2])*120;
 px[k]=base[0]+lift*10+shade*.55+sparkle*235;px[k+1]=base[1]+lift*18+shade*.85+sparkle*240;px[k+2]=base[2]+lift*22+shade*1.05+sparkle*245;px[k+3]=255}}
/* Feine Körnung */
for(let k=0;k<px.length;k+=4){const v=(rnd()-.5)*5;px[k]+=v;px[k+1]+=v;px[k+2]+=v}
ctx.putImageData(img,0,0);
/* Weiche Vignette */
const g=ctx.createRadialGradient(W/2,H*.45,W*.25,W/2,H*.45,W*.75);g.addColorStop(0,'rgba(5,12,18,0)');g.addColorStop(1,'rgba(5,12,18,.35)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
window.sceneDataURL=canvas.toDataURL('image/jpeg',quality);window.rendered=true;
</script>
