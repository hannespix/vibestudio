<!doctype html>
<meta charset="utf-8">
<title>Motiv: Sonne mit Sonnenflecken</title>
<!-- Prozedural erzeugtes Kapitelmotiv: der obere Bogen einer Sonnenscheibe im Weißlicht, wie man ihn von Sonnenobservatorien kennt – Randverdunkelung, Granulation, helle Fackelfelder am Rand und Gruppen von Sonnenflecken mit dunklem Kern und faserigem Hof, davor schwarzer Raum mit leichtem Schein. Die Flecken machen die Drehung der Scheibe sichtbar. Keine Aufnahme, kein KI-Bild. Parameter: ?seed=11&scale=2&q=.86. Rendern: node tools/render-scene.mjs sun -->
<style>html,body{margin:0;background:#000}canvas{display:block;max-width:100vw;height:auto}</style>
<canvas id="c"></canvas>
<script>
const params=new URLSearchParams(location.search),seed=+params.get('seed')||11,scale=+params.get('scale')||2,quality=+params.get('q')||.86;
const W=1600*scale,H=900*scale,u=scale,canvas=document.getElementById('c');canvas.width=W;canvas.height=H;const ctx=canvas.getContext('2d');
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry32(seed),range=(a,b)=>a+(b-a)*rnd(),TAU=Math.PI*2;
/* Scheibe: Mittelpunkt weit unter dem Bild, oben bleibt schwarzer Raum für den Titel (motion.js dreht um genau diesen Punkt) */
const C={x:800,y:1480},R=940;
const smooth=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};
const hash=(x,y,s)=>{let h=(Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(s+seed,1103515245))|0;h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296};
/* Zellrauschen für die Granulation: Abstand zum nächsten und zweitnächsten Zellkern */
function worley(x,y){const ix=Math.floor(x),iy=Math.floor(y);let f1=9,f2=9;for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const cx=ix+i,cy=iy+j,dx=cx+hash(cx,cy,1)-x,dy=cy+hash(cx,cy,2)-y,d=dx*dx+dy*dy;if(d<f1){f2=f1;f1=d}else if(d<f2)f2=d}return[Math.sqrt(f1),Math.sqrt(f2)]}
function vnoise(x,y,s=3){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy,sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy),a=hash(ix,iy,s),b=hash(ix+1,iy,s),c=hash(ix,iy+1,s),d=hash(ix+1,iy+1,s);return a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy}
const fbm=(x,y,s=3)=>{let v=0,a=.5,f=1;for(let o=0;o<4;o++){v+=vnoise(x*f,y*f,s+o)*a;f*=2.03;a*=.5}return v/.9375};
/* Oberflächenkoordinaten: Winkelabstand s von der Scheibenmitte statt Bildradius, so werden Zellen und Flecken zum Rand hin gestaucht wie auf einer Kugel */
const surface=(x,y)=>{const dx=x-C.x,dy=y-C.y,r=Math.hypot(dx,dy)/R;if(r>=1)return null;const s=Math.asin(r),phi=Math.atan2(dy,dx);return{r,mu:Math.sqrt(1-r*r),mx:s*R*Math.cos(phi),my:s*R*Math.sin(phi)}};
const toMap=(phiDeg,r)=>{const phi=phiDeg*Math.PI/180,s=Math.asin(r);return{x:s*R*Math.cos(phi),y:s*R*Math.sin(phi),tx:-Math.sin(phi),ty:Math.cos(phi)}};
/* Fleckengruppen im sichtbaren Band: Leitfleck und Folgefleck mit Hof, dazwischen kleine Poren */
const spots=[],groups=[];
for(const [phiDeg,r,size] of [[-131,.9,1],[-109,.8,1.25],[-90,.9,.8],[-71,.77,1.1],[-53,.93,.75]]){
 const g=toMap(phiDeg+range(-3,3),r+range(-.02,.02)),lead=range(9,13)*size,trail=lead*range(.55,.8),gap=range(48,72)*size,items=[];
 items.push({x:g.x-g.tx*gap*.45,y:g.y-g.ty*gap*.45,ru:lead,rp:lead*range(2.1,2.6)});
 items.push({x:g.x+g.tx*gap*.55+range(-6,6),y:g.y+g.ty*gap*.55+range(-6,6),ru:trail,rp:trail*range(1.9,2.4)});
 for(let i=0,n=Math.round(range(5,11)*size);i<n;i++){const t=range(-.7,.9),o=range(-18,18)*size,ru=range(1.4,3.6)*Math.sqrt(size);items.push({x:g.x+g.tx*gap*t+g.ty*o,y:g.y+g.ty*gap*t-g.tx*o,ru,rp:ru*(rnd()<.45?range(1.7,2.2):1.05)})}
 spots.push(...items);groups.push({x:g.x,y:g.y,reach:gap*.9+lead*3.2})}
/* Farbverlauf der Intensität: dunkler Fleckkern über Orange zu hellem Goldgelb in der Scheibenmitte */
const ramp=[[0,[20,5,2]],[.16,[62,18,6]],[.32,[128,46,12]],[.5,[196,92,24]],[.68,[236,138,44]],[.84,[250,178,74]],[1,[255,214,128]],[1.2,[255,236,176]]];
const colour=v=>{v=Math.max(0,Math.min(1.2,v));for(let i=1;i<ramp.length;i++)if(v<=ramp[i][0]){const [a,ca]=ramp[i-1],[b,cb]=ramp[i],t=(v-a)/(b-a);return[ca[0]+(cb[0]-ca[0])*t,ca[1]+(cb[1]-ca[1])*t,ca[2]+(cb[2]-ca[2])*t]}return ramp[ramp.length-1][1]};
const img=ctx.createImageData(W,H),px=img.data;
for(let j=0;j<H;j++){const y=(j+.5)/u;for(let i=0;i<W;i++){const x=(i+.5)/u,k=(j*W+i)*4,dist=Math.hypot(x-C.x,y-C.y),edge=Math.min(1,Math.max(0,(R-dist)*u+.5));
 /* Hintergrund: fast schwarzer Raum, warmer Schein dicht am Rand, ein weiter, sehr schwacher Hof */
 const out=Math.max(0,dist-R),glow=.26*Math.exp(-out/46)+.05*Math.exp(-out/210);let bg=[4+255*glow,5+120*glow,7+40*glow];
 if(edge<=0){px[k]=bg[0];px[k+1]=bg[1];px[k+2]=bg[2];px[k+3]=255;continue}
 const p=surface(Math.min(x,C.x+R*.9999),y)||{r:.9999,mu:.014,mx:0,my:0},mu=p.mu;
 /* Randverdunkelung (quadratisches Gesetz) */
 let I=1-.56*(1-mu)-.24*(1-mu)*(1-mu);
 /* Granulation: helle Zellen, dunkle Zwischenräume, zum Rand hin flacher */
 const [f1,f2]=worley(p.mx/6.5,p.my/6.5),lane=1-smooth(.03,.28,f2-f1),gran=.045*(.6-f1)-.06*lane;I*=1+gran*Math.sqrt(mu)+(fbm(p.mx/34,p.my/34,7)-.5)*.05;
 /* Fackelfelder: helle, wolkige Flächen nahe dem Rand, besonders um die Fleckengruppen */
 let near=0;for(const g of groups){const d=Math.hypot(p.mx-g.x,p.my-g.y);near=Math.max(near,Math.exp(-((d/g.reach)**2)))}
 I*=1+(smooth(.52,.8,fbm(p.mx/55,p.my/55,11))*.12+near*smooth(.45,.7,fbm(p.mx/22,p.my/22,13))*.22)*(1-smooth(.2,.75,mu));
 /* Sonnenflecken: Kern und Hof mit radialen Fasern */
 let M=1;if(near>.02)for(const s of spots){const dx=p.mx-s.x,dy=p.my-s.y,d=Math.hypot(dx,dy);if(d>s.rp*1.35)continue;const a=Math.atan2(dy,dx),w=(Math.cos(a)+1.3)*1.7,h=(Math.sin(a)+1.3)*1.7,shape=1+.34*(vnoise(w+s.x*.05,h+s.y*.05,19)-.5)+.14*(vnoise(w*3+s.x,h*3+s.y,23)-.5),rp=s.rp*shape,ru=s.ru*(1+.3*(vnoise(w*1.6+s.y,h*1.6+s.x,29)-.5)),fib=vnoise(a*s.rp*.55,d*.12+s.x,31)*.6+vnoise(a*s.rp*1.4,d*.3+s.y,37)*.4,kp=1-smooth(rp*.9,rp*1.04,d),ku=1-smooth(ru*.82,ru*1.02,d);let m=1+(.6+.14*(fib-.5)+.08*smooth(ru,rp,d)-1)*kp;m+=(.17-m)*ku;M=Math.min(M,m)}
 I*=M;
 const c=colour(I);px[k]=bg[0]+(c[0]-bg[0])*edge;px[k+1]=bg[1]+(c[1]-bg[1])*edge;px[k+2]=bg[2]+(c[2]-bg[2])*edge;px[k+3]=255}}
/* Feine Körnung */
for(let k=0;k<px.length;k+=4){const v=(rnd()-.5)*5;px[k]+=v;px[k+1]+=v;px[k+2]+=v}
ctx.putImageData(img,0,0);
window.sceneDataURL=canvas.toDataURL('image/jpeg',quality);window.rendered=true;
</script>
