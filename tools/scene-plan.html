<!doctype html>
<meta charset="utf-8">
<title>Motiv: Planstand</title>
<!-- Prozedural erzeugtes Kapitelmotiv „planstand“: der Bogen einer technischen Zeichnung auf Transparentpapier – doppelte Wandlinie mit Schraffur, Konstruktionsbögen, Maßkette, Stützen, Radialen und eine Änderungswolke. Kein Raster, kein Plankopf: Über dem Bogen bleibt das Papier leer, damit sich beim Drehen nur die Zeichnung bewegt. Parameter: ?seed=3&scale=2&q=.84. Rendern: node tools/render-scene.mjs plan -->
<style>html,body{margin:0;background:#000}canvas{display:block;max-width:100vw;height:auto}</style>
<canvas id="c"></canvas>
<script>
const params=new URLSearchParams(location.search),seed=+params.get('seed')||3,scale=+params.get('scale')||2,quality=+params.get('q')||.84;
const W=1600*scale,H=900*scale,u=scale,canvas=document.getElementById('c');canvas.width=W;canvas.height=H;const ctx=canvas.getContext('2d');
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry32(seed),range=(a,b)=>a+(b-a)*rnd(),X=x=>x*u,Y=y=>y*u,TAU=Math.PI*2;
const C={x:900,y:1340},R=700,A0=Math.PI*1.06,A1=Math.PI*1.94,INK='47,62,73',RUST='173,101,73';
const P=(r,a)=>[X(C.x+Math.cos(a)*r),Y(C.y+Math.sin(a)*r)];
const line=(a,b,w,alpha,colour=INK,dash)=>{ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.lineWidth=u*w;ctx.strokeStyle=`rgba(${colour},${alpha})`;ctx.setLineDash(dash?dash.map(d=>d*u):[]);ctx.stroke();ctx.setLineDash([])};
const arc=(r,a0,a1,w,alpha,colour=INK,dash)=>{ctx.beginPath();ctx.arc(X(C.x),Y(C.y),X(r),a0,a1);ctx.lineWidth=u*w;ctx.strokeStyle=`rgba(${colour},${alpha})`;ctx.setLineDash(dash?dash.map(d=>d*u):[]);ctx.stroke();ctx.setLineDash([])};
/* 1 · Transparentpapier */
let g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#f0e9dc');g.addColorStop(.55,'#ebe3d3');g.addColorStop(1,'#e3dac8');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
/* 3 · Konstruktionsbögen und Radialen */
arc(340,A0,A1,1,.22);arc(470,A0,A1,1,.22,INK,[7,9]);arc(600,A0,A1,1.1,.32);arc(760,A0,A1,1,.38,INK,[9,7]);
for(let a=A0;a<=A1+.001;a+=Math.PI*.055){line(P(300,a),P(800,a),.9,.18,INK,[5,7])}
/* 4 · Die Wand: doppelte Linie mit Schraffur */
for(let a=A0;a<A1;a+=.0105){line(P(668,a),P(700,a+.011),1,.42)}
arc(700,A0,A1,2.4,.86);arc(668,A0,A1,1.5,.72);
/* 5 · Stützen auf dem Bogen und Maßkette mit Schrägstrichen */
const cols=[];for(let a=A0+.09;a<A1-.05;a+=Math.PI*.11)cols.push(a);
for(const a of cols){const [x,y]=P(634,a);ctx.beginPath();ctx.arc(x,y,X(9),0,TAU);ctx.fillStyle='#efe8da';ctx.fill();ctx.lineWidth=u*1.6;ctx.strokeStyle=`rgba(${INK},.8)`;ctx.stroke();line([x-X(15),y],[x+X(15),y],.8,.5);line([x,y-X(15)],[x,y+X(15)],.8,.5)}
arc(790,cols[0],cols[cols.length-1],1,.55);
for(const a of cols){line(P(778,a),P(802,a),.9,.55);const [x,y]=P(790,a);line([x-X(7),y+X(7)],[x+X(7),y-X(7)],1.6,.75)}
for(const a of cols){line(P(704,a),P(806,a),.7,.28,INK,[3,5])}
/* 6 · Änderungswolke in Rost mit Index-Marke */
const ca=Math.PI*1.56,cb=Math.PI*1.71;ctx.lineWidth=u*2;ctx.strokeStyle=`rgba(${RUST},.9)`;
for(let a=ca;a<cb;a+=.016){const [x,y]=P(736,a+.008);ctx.beginPath();ctx.arc(x,y,X(9),a-Math.PI*.45,a+Math.PI*.45);ctx.stroke()}
for(let a=ca;a<cb;a+=.016){const [x,y]=P(632,a+.008);ctx.beginPath();ctx.arc(x,y,X(9),a+Math.PI*.55,a+Math.PI*1.45);ctx.stroke()}
{const [x,y]=P(770,cb+.03);ctx.beginPath();ctx.moveTo(x,y-X(16));ctx.lineTo(x+X(14),y+X(10));ctx.lineTo(x-X(14),y+X(10));ctx.closePath();ctx.fillStyle=`rgba(${RUST},.95)`;ctx.fill()}
/* 7 · Vignette und Papierkörnung */
g=ctx.createRadialGradient(X(800),Y(450),X(400),X(800),Y(450),X(1150));g.addColorStop(0,'rgba(90,70,40,0)');g.addColorStop(1,'rgba(90,70,40,.16)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
const img=ctx.getImageData(0,0,W,H),px=img.data;for(let i=0;i<px.length;i+=4){const n=(rnd()-.5)*10;px[i]+=n;px[i+1]+=n;px[i+2]+=n}ctx.putImageData(img,0,0);
window.sceneDataURL=canvas.toDataURL('image/jpeg',quality);window.rendered=true;
</script>
