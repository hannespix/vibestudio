<!-- Kapitelmotiv „prüfen“: ein Astrolabium aus vergoldetem Messing, ein Messinstrument mit Gradskalen, Sternzeigern und Lineal. Bearbeitung: Scheibe freigestellt und leicht entzerrt, um 180° gedreht (der Aufhängering liegt unten außerhalb des Bildes), auf nachtblauen Grund mit weichem Schatten gesetzt. Rendern: node tools/render-scene.mjs astrolabe -->
<style>html,body{margin:0;background:#000}canvas{display:block;max-width:100vw;height:auto}</style>
<canvas id="c"></canvas>
<script>
/* Rand der Mutterscheibe in der Vorlage: Mittelpunkt 1810/2363, Radius 998 px waagrecht, 1013 px senkrecht */
window.PHOTO={circle:{x:1810,y:2363,r:998},squash:{y:998/1013},scale:600/998,apex:{x:800,y:520},turn:180,clip:1.003,fill:'#0b1119',
 before:(ctx,{C,R,u,W,H})=>{const g=ctx.createRadialGradient(C.x*u,C.y*u,R*.9*u,C.x*u,C.y*u,R*2.2*u);g.addColorStop(0,'#1f2d3d');g.addColorStop(1,'#0a0f16');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)},
 shadow:{alpha:.75,blur:24,dy:10,size:1.01},grade:'contrast(1.06) saturate(1.05)',grain:4};
</script>
