<!doctype html>
<meta charset="utf-8">
<title>Motiv: Torbogen</title>
<!-- Prozedural erzeugtes Kapitelmotiv „loslegen“: ein Rundbogen aus Keilsteinen mit Schlussstein in einer hellen Putzwand, durch den warmes Licht fällt. Kein Boden, kein Horizont: oben bleibt die Wand leer, die strahlenförmigen Fugen machen die Drehung sichtbar. Parameter: ?seed=6&scale=2&q=.86. Rendern: node tools/render-scene.mjs arch -->
<style>html,body{margin:0;background:#000}canvas{display:block;max-width:100vw;height:auto}</style>
<canvas id="c"></canvas>
<script>
const params=new URLSearchParams(location.search),seed=+params.get('seed')||6,scale=+params.get('scale')||2,quality=+params.get('q')||.86;
const W=1600*scale,H=900*scale,u=scale,canvas=document.getElementById('c');canvas.width=W;canvas.height=H;const ctx=canvas.getContext('2d');
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry32(seed),range=(a,b)=>a+(b-a)*rnd(),X=x=>x*u,Y=y=>y*u,TAU=Math.PI*2;
/* Bogen: Mittelpunkt unter dem Bild (motion.js dreht um genau diesen Punkt), Öffnung R, Steinkranz bis R+RING */
const C={x:800,y:1120},R=440,RING=110;
const annulus=(r0,r1,a0,a1)=>{ctx.beginPath();ctx.arc(X(C.x),Y(C.y),X(r1),a0,a1);ctx.arc(X(C.x),Y(C.y),X(r0),a1,a0,true);ctx.closePath()};
/* 1 · Putzwand: warmes Hell, feine Körnung, Streiflicht von rechts */
let g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#d8c7ae');g.addColorStop(.5,'#e0d2bd');g.addColorStop(1,'#cfbda3');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.fillStyle='rgba(90,70,50,.09)';for(let i=0;i<40000;i++)ctx.fillRect(X(range(0,1600)),Y(range(0,900)),u*range(.6,1.8),u*range(.6,1.8));
ctx.fillStyle='rgba(255,250,240,.12)';for(let i=0;i<24000;i++)ctx.fillRect(X(range(0,1600)),Y(range(0,900)),u*range(.6,1.6),u*range(.6,1.6));
g=ctx.createLinearGradient(0,0,W,0);g.addColorStop(0,'rgba(60,40,25,.12)');g.addColorStop(.5,'rgba(60,40,25,0)');g.addColorStop(1,'rgba(255,245,230,.14)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
/* 2 · Warmer Schein, der aus der Öffnung auf die Wand fällt */
g=ctx.createRadialGradient(X(C.x),Y(C.y-120),X(R*.6),X(C.x),Y(C.y-120),X(R+RING+420));g.addColorStop(0,'rgba(255,238,205,.6)');g.addColorStop(.5,'rgba(255,238,205,.2)');g.addColorStop(1,'rgba(255,236,200,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
/* 3 · Schatten des Steinkranzes auf der Wand */
g=ctx.createRadialGradient(X(C.x+6),Y(C.y+8),X(R+RING-8),X(C.x+6),Y(C.y+8),X(R+RING+46));g.addColorStop(0,'rgba(70,50,30,.32)');g.addColorStop(1,'rgba(70,50,30,0)');ctx.fillStyle=g;annulus(R+RING-8,R+RING+46,Math.PI,TAU);ctx.fill();
/* 4 · Die Öffnung: nur Licht, zur Mitte hin fast weiß */
ctx.beginPath();ctx.arc(X(C.x),Y(C.y),X(R),0,TAU);ctx.save();ctx.clip();
g=ctx.createRadialGradient(X(C.x+40),Y(C.y-150),X(20),X(C.x),Y(C.y),X(R));g.addColorStop(0,'#fffdf7');g.addColorStop(.45,'#fff6e4');g.addColorStop(.8,'#fbe7c6');g.addColorStop(1,'#f1d6ad');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
/* Laibung: schmaler Rand innen, links im Schatten, rechts im Licht */
g=ctx.createLinearGradient(X(C.x-R),0,X(C.x+R),0);g.addColorStop(0,'rgba(120,95,70,.55)');g.addColorStop(.5,'rgba(200,180,150,.25)');g.addColorStop(1,'rgba(255,248,235,.5)');ctx.strokeStyle=g;ctx.lineWidth=u*26;ctx.beginPath();ctx.arc(X(C.x),Y(C.y),X(R-13),0,TAU);ctx.stroke();
ctx.restore();
/* 5 · Keilsteine: strahlenförmige Fugen, jeder Stein leicht anders getönt, Schlussstein oben etwas größer */
const n=19,step=Math.PI/n,base=[211,192,160];
for(let i=-3;i<n+3;i++){const a0=Math.PI+i*step,a1=a0+step,key=i===(n-1)/2,r1=R+RING+(key?16:0),lift=range(-9,9),warm=range(-3,3),t=[base[0]+lift+warm,base[1]+lift,base[2]+lift-warm],mid=(a0+a1)/2;
 annulus(R,r1,a0+.004,a1-.004);const lg=ctx.createLinearGradient(X(C.x+Math.cos(mid)*R),Y(C.y+Math.sin(mid)*R),X(C.x+Math.cos(mid)*r1),Y(C.y+Math.sin(mid)*r1));
 lg.addColorStop(0,`rgb(${t.map(v=>v+10).join(',')})`);lg.addColorStop(1,`rgb(${t.map(v=>v-12).join(',')})`);ctx.fillStyle=lg;ctx.fill();
 /* Streiflicht von rechts oben: hellere Kante auf der Lichtseite jedes Steins, Schatten auf der anderen */
 ctx.save();ctx.clip();ctx.lineWidth=u*3;ctx.strokeStyle='rgba(255,250,238,.55)';ctx.beginPath();ctx.moveTo(X(C.x+Math.cos(a1-.006)*R),Y(C.y+Math.sin(a1-.006)*R));ctx.lineTo(X(C.x+Math.cos(a1-.006)*r1),Y(C.y+Math.sin(a1-.006)*r1));ctx.stroke();
 ctx.strokeStyle='rgba(90,68,46,.3)';ctx.beginPath();ctx.moveTo(X(C.x+Math.cos(a0+.006)*R),Y(C.y+Math.sin(a0+.006)*R));ctx.lineTo(X(C.x+Math.cos(a0+.006)*r1),Y(C.y+Math.sin(a0+.006)*r1));ctx.stroke();
 ctx.fillStyle='rgba(90,70,50,.12)';for(let s=0;s<260;s++){const aa=range(a0,a1),rr=range(R,r1);ctx.fillRect(X(C.x+Math.cos(aa)*rr),Y(C.y+Math.sin(aa)*rr),u*range(.8,2.2),u*range(.8,2.2))}
 ctx.restore()}
/* Fugen und Kanten des Kranzes */
ctx.strokeStyle='rgba(96,76,54,.55)';ctx.lineWidth=u*2.2;for(let i=-3;i<=n+3;i++){const a=Math.PI+i*step,key=i===(n-1)/2||i===(n+1)/2,r1=R+RING+(key?16:0);ctx.beginPath();ctx.moveTo(X(C.x+Math.cos(a)*R),Y(C.y+Math.sin(a)*R));ctx.lineTo(X(C.x+Math.cos(a)*r1),Y(C.y+Math.sin(a)*r1));ctx.stroke()}
{const lg=ctx.createLinearGradient(X(C.x-R-RING),0,X(C.x+R+RING),0);lg.addColorStop(0,'rgba(96,76,54,.5)');lg.addColorStop(1,'rgba(255,250,238,.65)');ctx.strokeStyle=lg;ctx.lineWidth=u*2.4;ctx.beginPath();ctx.arc(X(C.x),Y(C.y),X(R+RING),Math.PI*.9,TAU*1.05);ctx.stroke();ctx.beginPath();ctx.arc(X(C.x),Y(C.y),X(R+1),Math.PI*.9,TAU*1.05);ctx.strokeStyle='rgba(110,86,60,.45)';ctx.stroke()}
/* 6 · Vignette und Körnung */
g=ctx.createRadialGradient(X(800),Y(430),X(460),X(800),Y(450),X(1150));g.addColorStop(0,'rgba(70,50,30,0)');g.addColorStop(1,'rgba(70,50,30,.16)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
const img=ctx.getImageData(0,0,W,H),px=img.data;for(let i=0;i<px.length;i+=4){const v=(rnd()-.5)*7;px[i]+=v;px[i+1]+=v;px[i+2]+=v}ctx.putImageData(img,0,0);
window.sceneDataURL=canvas.toDataURL('image/jpeg',quality);window.rendered=true;
</script>
