<!doctype html>
<meta charset="utf-8">
<title>Motiv: Torbogen</title>
<!-- Prozedural erzeugtes Kapitelmotiv „loslegen“: ein Rundbogen in einer Putzwand, durch den warmes Licht fällt – Laibung mit Licht- und Schattenseite, Lichtschein auf dem Boden, feine Putzstruktur. Parameter: ?seed=6&scale=2&q=.84. Rendern: node tools/render-scene.mjs arch -->
<style>html,body{margin:0;background:#000}canvas{display:block;max-width:100vw;height:auto}</style>
<canvas id="c"></canvas>
<script>
const params=new URLSearchParams(location.search),seed=+params.get('seed')||6,scale=+params.get('scale')||2,quality=+params.get('q')||.84;
const W=1600*scale,H=900*scale,u=scale,canvas=document.getElementById('c');canvas.width=W;canvas.height=H;const ctx=canvas.getContext('2d');
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry32(seed),range=(a,b)=>a+(b-a)*rnd(),X=x=>x*u,Y=y=>y*u,TAU=Math.PI*2;
const C={x:800,y:1010},R=440,DEPTH=48;
const opening=r=>{ctx.beginPath();ctx.arc(X(C.x),Y(C.y),X(r),Math.PI,TAU);ctx.lineTo(X(C.x+r),H);ctx.lineTo(X(C.x-r),H);ctx.closePath()};
/* 1 · Putzwand mit feiner Struktur und Streiflicht von rechts */
let g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#d4c1a8');g.addColorStop(.5,'#dccdb7');g.addColorStop(1,'#c9b69c');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.fillStyle='rgba(90,70,50,.10)';for(let i=0;i<40000;i++)ctx.fillRect(X(range(0,1600)),Y(range(0,900)),u*range(.6,1.8),u*range(.6,1.8));
ctx.fillStyle='rgba(255,250,240,.12)';for(let i=0;i<24000;i++)ctx.fillRect(X(range(0,1600)),Y(range(0,900)),u*range(.6,1.6),u*range(.6,1.6));
g=ctx.createLinearGradient(0,0,W,0);g.addColorStop(0,'rgba(60,40,25,.14)');g.addColorStop(.5,'rgba(60,40,25,0)');g.addColorStop(1,'rgba(255,245,230,.16)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
/* 2 · Lichtschein aus der Öffnung auf Wand und Boden */
g=ctx.createRadialGradient(X(C.x),Y(C.y-80),X(R*.5),X(C.x),Y(C.y-80),X(R+420));g.addColorStop(0,'rgba(255,238,205,.7)');g.addColorStop(.55,'rgba(255,238,205,.22)');g.addColorStop(1,'rgba(255,236,200,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
g=ctx.createRadialGradient(X(C.x),Y(C.y-R+40),X(60),X(C.x),Y(C.y-R+40),X(560));g.addColorStop(0,'rgba(255,240,210,.55)');g.addColorStop(.5,'rgba(255,240,210,.18)');g.addColorStop(1,'rgba(255,240,210,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
/* 3 · Laibung: Schattenseite links, Lichtseite rechts */
opening(R+DEPTH);g=ctx.createLinearGradient(X(C.x-R-DEPTH),0,X(C.x+R+DEPTH),0);g.addColorStop(0,'#8f7a63');g.addColorStop(.5,'#c9b598');g.addColorStop(1,'#f0e3cf');ctx.fillStyle=g;ctx.fill();
/* 4 · Die Öffnung: warmes Licht, Horizont, Boden dahinter */
opening(R);ctx.save();ctx.clip();
g=ctx.createLinearGradient(0,Y(C.y-R),0,H);g.addColorStop(0,'#fffaf0');g.addColorStop(.5,'#fdf0d8');g.addColorStop(.7,'#f7e3c4');g.addColorStop(.72,'#e2c9a6');g.addColorStop(.76,'#ead4b4');g.addColorStop(1,'#d8be9b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
for(let i=0;i<5;i++){const y=C.y-R+(H/u-(C.y-R))*.72+i*9;ctx.fillStyle=`rgba(190,160,120,${.12-i*.02})`;ctx.fillRect(0,Y(y),W,Y(2))}
g=ctx.createRadialGradient(X(C.x+60),Y(C.y-260),X(20),X(C.x+60),Y(C.y-260),X(520));g.addColorStop(0,'rgba(255,255,250,.85)');g.addColorStop(.4,'rgba(255,255,250,.25)');g.addColorStop(1,'rgba(255,255,250,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.restore();
ctx.beginPath();ctx.arc(X(C.x),Y(C.y),X(R+1),Math.PI,TAU);ctx.lineWidth=u*2;ctx.strokeStyle='rgba(120,95,70,.35)';ctx.stroke();
{const lg=ctx.createLinearGradient(X(C.x-R),0,X(C.x+R),0);lg.addColorStop(0,'rgba(90,70,50,.3)');lg.addColorStop(.5,'rgba(200,185,160,.2)');lg.addColorStop(1,'rgba(255,250,240,.6)');ctx.beginPath();ctx.arc(X(C.x),Y(C.y),X(R+DEPTH),Math.PI,TAU);ctx.lineWidth=u*3;ctx.strokeStyle=lg;ctx.stroke()}
/* 5 · Boden vor dem Bogen: heller Stein mit Lichtfleck */
g=ctx.createLinearGradient(0,Y(852),0,H);g.addColorStop(0,'rgba(220,206,186,0)');g.addColorStop(.3,'#d9cab3');g.addColorStop(1,'#cbb99f');ctx.fillStyle=g;ctx.fillRect(0,Y(852),W,Y(48));
g=ctx.createRadialGradient(X(C.x),Y(900),X(40),X(C.x),Y(900),X(520));g.addColorStop(0,'rgba(255,240,210,.7)');g.addColorStop(1,'rgba(255,240,210,0)');ctx.fillStyle=g;ctx.fillRect(0,Y(852),W,Y(48));
/* 6 · Vignette und Körnung */
g=ctx.createRadialGradient(X(800),Y(450),X(450),X(800),Y(450),X(1150));g.addColorStop(0,'rgba(70,50,30,0)');g.addColorStop(1,'rgba(70,50,30,.18)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
const img=ctx.getImageData(0,0,W,H),px=img.data;for(let i=0;i<px.length;i+=4){const v=(rnd()-.5)*7;px[i]+=v;px[i+1]+=v;px[i+2]+=v}ctx.putImageData(img,0,0);
window.sceneDataURL=canvas.toDataURL('image/jpeg',quality);window.rendered=true;
</script>
