<!doctype html>
<meta charset="utf-8">
<title>Motiv: Lupe</title>
<!-- Prozedural erzeugtes Kapitelmotiv „prüfen“: der obere Bogen einer Lupe mit Messingfassung über einer Seite mit Textzeilen und einem Diff-Block (grün ergänzt, rot entfernt); im Glas erscheint die Seite vergrößert, mit Glanzlicht und Randschatten. Parameter: ?seed=4&scale=2&q=.84. Rendern: node tools/render-scene.mjs lens -->
<style>html,body{margin:0;background:#000}canvas{display:block;max-width:100vw;height:auto}</style>
<canvas id="c"></canvas>
<script>
const params=new URLSearchParams(location.search),seed=+params.get('seed')||4,scale=+params.get('scale')||2,quality=+params.get('q')||.84;
const W=1600*scale,H=900*scale,u=scale,canvas=document.getElementById('c');canvas.width=W;canvas.height=H;const ctx=canvas.getContext('2d');
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry32(seed),range=(a,b)=>a+(b-a)*rnd(),X=x=>x*u,Y=y=>y*u,TAU=Math.PI*2;
const C={x:800,y:1180},R=600,RIM=34,ZOOM=1.5;
/* Seite mit Zeilen: feste Zufallsfolge, damit Außen- und Innenansicht dieselbe Seite zeigen */
const rows=[];{const r2=mulberry32(seed+100);for(let i=0;i<46;i++){const segs=[];let x=0;const n=3+Math.floor(r2()*4);for(let k=0;k<n;k++){const w=60+r2()*200;segs.push([x,w]);x+=w+24}rows.push({indent:[0,0,40,40,80,40,0][Math.floor(r2()*7)],segs,mark:i>=26&&i<=28?'+':i>=30&&i<=31?'-':''})}}
const page=(scaleF,alpha)=>{ctx.save();ctx.translate(X(C.x),Y(C.y));ctx.scale(scaleF,scaleF);ctx.translate(-X(C.x),-Y(C.y));
 const lh=30,x0=640,y0=80;
 for(let i=0;i<rows.length;i++){const y=y0+i*lh,w=[120,180,90,150,200,110,160][i%7];ctx.fillStyle=`rgba(110,100,88,${(i%9===0?.3:.16)*alpha})`;ctx.beginPath();ctx.roundRect(X(150+(i%9===0?0:26)),Y(y-1),X(w),Y(12),X(6));ctx.fill()}
 ctx.fillStyle=`rgba(110,100,88,${.18*alpha})`;ctx.fillRect(X(470),Y(40),X(1.5),Y(1500));
 for(let i=0;i<rows.length;i++){const row=rows[i],y=y0+i*lh;
  if(row.mark){ctx.fillStyle=row.mark==='+'?`rgba(98,115,100,${.22*alpha})`:`rgba(173,101,73,${.2*alpha})`;ctx.fillRect(X(x0-110),Y(y-8),X(1500),Y(lh));ctx.fillStyle=row.mark==='+'?`rgba(62,90,68,${alpha})`:`rgba(160,74,48,${alpha})`;ctx.font=`600 ${Math.round(22*u)}px "DM Sans",Arial,sans-serif`;ctx.textBaseline='middle';ctx.textAlign='center';ctx.fillText(row.mark,X(x0-28),Y(y+5))}
  ctx.fillStyle=`rgba(90,82,70,${.18*alpha})`;ctx.font=`${Math.round(13*u)}px "DM Sans",Arial,sans-serif`;ctx.textAlign='right';ctx.fillText(String(i+112),X(x0-62),Y(y+5));
  for(const [sx,w] of row.segs){ctx.fillStyle=row.mark?`rgba(60,55,48,${.5*alpha})`:`rgba(110,100,88,${.32*alpha})`;const rx=X(x0+row.indent+sx),ry=Y(y-1),rw=X(w),rh=Y(12);ctx.beginPath();ctx.roundRect(rx,ry,rw,rh,X(6));ctx.fill()}}
 ctx.restore()};
/* 1 · Papier */
let g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#f3eee4');g.addColorStop(.6,'#efe9dd');g.addColorStop(1,'#e6dfd0');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
page(1,.75);
g=ctx.createRadialGradient(X(800),Y(370),X(80),X(800),Y(370),X(560));g.addColorStop(0,'rgba(240,234,222,.92)');g.addColorStop(.6,'rgba(240,234,222,.6)');g.addColorStop(1,'rgba(240,234,222,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
/* 2 · Schatten der Lupe auf der Seite */
g=ctx.createRadialGradient(X(C.x+26),Y(C.y+40),X(R),X(C.x+26),Y(C.y+40),X(R+150));g.addColorStop(0,'rgba(60,45,30,.34)');g.addColorStop(1,'rgba(60,45,30,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
/* 3 · Glas: dieselbe Seite vergrößert, leichte Tönung, Randabdunklung, Glanzlicht */
ctx.save();ctx.beginPath();ctx.arc(X(C.x),Y(C.y),X(R),0,TAU);ctx.clip();
ctx.fillStyle='#f8f3e9';ctx.fillRect(0,0,W,H);
page(ZOOM,1);
g=ctx.createRadialGradient(X(C.x),Y(C.y),X(R*.6),X(C.x),Y(C.y),X(R));g.addColorStop(0,'rgba(120,140,150,0)');g.addColorStop(1,'rgba(90,110,125,.22)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
g=ctx.createRadialGradient(X(C.x-300),Y(C.y-470),X(20),X(C.x-300),Y(C.y-470),X(460));g.addColorStop(0,'rgba(255,255,255,.55)');g.addColorStop(.35,'rgba(255,255,255,.18)');g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.beginPath();ctx.arc(X(C.x),Y(C.y),X(R-70),Math.PI*1.12,Math.PI*1.36);ctx.lineWidth=u*14;ctx.lineCap='round';ctx.strokeStyle='rgba(255,255,255,.5)';ctx.stroke();
ctx.restore();
/* 4 · Fassung aus Messing */
g=ctx.createLinearGradient(X(C.x-R),Y(C.y-R),X(C.x+R),Y(C.y));g.addColorStop(0,'#8c6a3e');g.addColorStop(.35,'#dcbd7c');g.addColorStop(.6,'#b08c56');g.addColorStop(1,'#7f5e34');
ctx.beginPath();ctx.arc(X(C.x),Y(C.y),X(R+RIM/2),0,TAU);ctx.lineWidth=u*RIM;ctx.strokeStyle=g;ctx.stroke();
ctx.beginPath();ctx.arc(X(C.x),Y(C.y),X(R+2),0,TAU);ctx.lineWidth=u*3;ctx.strokeStyle='rgba(50,35,15,.55)';ctx.stroke();
ctx.beginPath();ctx.arc(X(C.x),Y(C.y),X(R+RIM-2),0,TAU);ctx.lineWidth=u*2.5;ctx.strokeStyle='rgba(255,240,210,.5)';ctx.stroke();
ctx.beginPath();ctx.arc(X(C.x),Y(C.y),X(R+RIM/2),Math.PI*1.08,Math.PI*1.3);ctx.lineWidth=u*(RIM-10);ctx.strokeStyle='rgba(255,245,225,.32)';ctx.stroke();
/* 5 · Vignette und Papierkörnung */
g=ctx.createRadialGradient(X(800),Y(450),X(420),X(800),Y(450),X(1150));g.addColorStop(0,'rgba(90,70,40,0)');g.addColorStop(1,'rgba(90,70,40,.16)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
const img=ctx.getImageData(0,0,W,H),px=img.data;for(let i=0;i<px.length;i+=4){const v=(rnd()-.5)*8;px[i]+=v;px[i+1]+=v;px[i+2]+=v}ctx.putImageData(img,0,0);
window.sceneDataURL=canvas.toDataURL('image/jpeg',quality);window.rendered=true;
</script>
