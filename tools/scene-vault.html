<!doctype html>
<meta charset="utf-8">
<title>Motiv: Tresortür</title>
<!-- Prozedural erzeugtes Kapitelmotiv „bewahren“: der obere Bogen einer runden Tresortür aus gebürstetem Stahl – Zarge mit Schrauben, Kranz aus Riegelbolzen, Zahlenring wie an einem Kombinationsschloss, darüber eine leere, helle Betonwand. Bolzen, Skala und der Glanz auf den Drehriefen machen die Drehung sichtbar. Angelehnt an die Idee eines Archivs im Berg, keine Darstellung des realen Arctic World Archive. Parameter: ?seed=7&scale=2&q=.86. Rendern: node tools/render-scene.mjs vault -->
<style>html,body{margin:0;background:#000}canvas{display:block;max-width:100vw;height:auto}</style>
<canvas id="c"></canvas>
<script>
const params=new URLSearchParams(location.search),seed=+params.get('seed')||7,scale=+params.get('scale')||2,quality=+params.get('q')||.86;
const W=1600*scale,H=900*scale,u=scale,canvas=document.getElementById('c');canvas.width=W;canvas.height=H;const ctx=canvas.getContext('2d');
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry32(seed),range=(a,b)=>a+(b-a)*rnd(),X=x=>x*u,Y=y=>y*u,TAU=Math.PI*2;
/* Tür: Mittelpunkt unter dem Bild (motion.js dreht um genau diesen Punkt), Zarge außen, oben bleibt die Wand frei */
const C={x:800,y:1390},R=780,FRAME=58;
const smooth=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};
const hash=(x,y,s)=>{let h=(Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(s+seed,1103515245))|0;h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296};
function vnoise(x,y,s=3){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy,sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy),a=hash(ix,iy,s),b=hash(ix+1,iy,s),c=hash(ix,iy+1,s),d=hash(ix+1,iy+1,s);return a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy}
const fbm=(x,y,s=3)=>{let v=0,a=.5,f=1;for(let o=0;o<4;o++){v+=vnoise(x*f,y*f,s+o)*a;f*=2.03;a*=.5}return v/.9375};
const groove=r=>(vnoise(r*.9,0,41)-.5)*.6+(vnoise(r*3.3,7,43)-.5)*.4;
/* Stahl: kühles Grau, gebürstet (Drehriefen), anisotroper Glanz in zwei gegenüberliegenden Sektoren */
const steel=L=>[64+178*L,70+176*L,78+172*L];
const img=ctx.createImageData(W,H),px=img.data,A0=-2.2;
for(let j=0;j<H;j++){const y=(j+.5)/u;for(let i=0;i<W;i++){const x=(i+.5)/u,k=(j*W+i)*4,dx=x-C.x,dy=y-C.y,d=Math.hypot(dx,dy),a=Math.atan2(dy,dx);let c;
 if(d>=R+FRAME){/* Betonwand: hell, fein wolkig, dunkler Schatten dicht an der Zarge */
  const v=.92-.07*(y/900)+(fbm(x/170,y/170,5)-.5)*.07+(fbm(x/28,y/28,9)-.5)*.035,sh=.22*Math.exp(-(d-R-FRAME)/26)+.07*Math.exp(-(d-R-FRAME)/140);const L=v*(1-sh);c=[250*L-8,254*L-6,258*L-4]}
 else if(d>=R+6){/* Zarge: dunkler Stahl, radial gebürstet */
  const t=(d-R-6)/(FRAME-6),L=.42+.1*Math.cos(2*(a-A0))+.05*groove(a*R*.9)-.1*t+.06*smooth(.85,1,t);c=steel(L)}
 else if(d>=R){/* Fuge zwischen Tür und Zarge */c=[36,40,45]}
 else{/* Tür: Drehriefen und Glanz; Bolzenkranz, Zahlenring und Innenfeld unterschiedlich hell */
  let L=.56+.2*Math.cos(2*(a-A0))+.07*Math.cos(a+.6)+.05*groove(d);
  if(d>R-112)L*=.93;if(d<R-150&&d>R-232)L=.3+.07*Math.cos(2*(a-A0))+.025*groove(d);if(d<R-300)L*=.96;
  c=steel(Math.max(0,Math.min(1.1,L)))}
 px[k]=c[0];px[k+1]=c[1];px[k+2]=c[2];px[k+3]=255}}
ctx.putImageData(img,0,0);
const ring=(r,width,style)=>{ctx.beginPath();ctx.arc(X(C.x),Y(C.y),X(r),0,TAU);ctx.lineWidth=u*width;ctx.strokeStyle=style;ctx.stroke()};
/* Relief: helle Kanten oben links, dunkle unten rechts */
const bevel=(r,light,dark,w=2)=>{const g=ctx.createConicGradient(0,X(C.x),Y(C.y));g.addColorStop(0,dark);g.addColorStop(.3,dark);g.addColorStop(.62,light);g.addColorStop(.75,light);g.addColorStop(1,dark);ring(r,w,g)};
bevel(R+FRAME-1,'rgba(255,255,255,.55)','rgba(20,24,28,.35)',2.5);bevel(R+7,'rgba(10,12,14,.55)','rgba(255,255,255,.3)',2);
bevel(R-2,'rgba(255,255,255,.8)','rgba(20,24,28,.5)',3);bevel(R-112,'rgba(255,255,255,.55)','rgba(20,24,28,.4)',2);ring(R-114,1.2,'rgba(20,24,28,.35)');
bevel(R-150,'rgba(20,24,28,.6)','rgba(255,255,255,.35)',2);bevel(R-232,'rgba(255,255,255,.45)','rgba(20,24,28,.55)',2);bevel(R-300,'rgba(255,255,255,.5)','rgba(20,24,28,.4)',2);
/* Schrauben in der Zarge */
for(let n=0;n<72;n++){const a=n/72*TAU,x=C.x+Math.cos(a)*(R+33),y=C.y+Math.sin(a)*(R+33);if(y<-20||y>920)continue;const g=ctx.createRadialGradient(X(x-2),Y(y-2),0,X(x),Y(y),X(7));g.addColorStop(0,'#e8ecef');g.addColorStop(.6,'#8c959d');g.addColorStop(1,'#3e454b');ctx.fillStyle=g;ctx.beginPath();ctx.arc(X(x),Y(y),X(6.5),0,TAU);ctx.fill();ctx.strokeStyle='rgba(30,34,38,.55)';ctx.lineWidth=u*1.2;ctx.beginPath();ctx.moveTo(X(x+Math.cos(a+1.1)*4.2),Y(y+Math.sin(a+1.1)*4.2));ctx.lineTo(X(x-Math.cos(a+1.1)*4.2),Y(y-Math.sin(a+1.1)*4.2));ctx.stroke()}
/* Kranz aus Riegelbolzen: verchromte Köpfe mit Schatten */
for(let n=0;n<36;n++){const a=n/36*TAU+.04,x=C.x+Math.cos(a)*(R-60),y=C.y+Math.sin(a)*(R-60);if(y<-40||y>940)continue;
 let g=ctx.createRadialGradient(X(x+4),Y(y+6),X(10),X(x+4),Y(y+6),X(30));g.addColorStop(0,'rgba(20,24,28,.4)');g.addColorStop(1,'rgba(20,24,28,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(X(x+4),Y(y+6),X(30),0,TAU);ctx.fill();
 g=ctx.createRadialGradient(X(x-7),Y(y-8),X(1),X(x),Y(y),X(24));g.addColorStop(0,'#fbfcfd');g.addColorStop(.25,'#d9dfe4');g.addColorStop(.7,'#7f8891');g.addColorStop(1,'#3b4148');ctx.fillStyle=g;ctx.beginPath();ctx.arc(X(x),Y(y),X(23),0,TAU);ctx.fill();
 ctx.strokeStyle='rgba(25,29,33,.6)';ctx.lineWidth=u*1.5;ctx.stroke();ctx.beginPath();ctx.arc(X(x),Y(y),X(13),0,TAU);ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=u*1.2;ctx.stroke()}
/* Zahlenring: 100 Teilstriche, jede zehnte Zahl */
ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`500 ${X(25)}px "DM Sans","Helvetica Neue",Arial,sans-serif`;
for(let n=0;n<100;n++){const a=-Math.PI/2+n/100*TAU,len=n%10===0?30:n%5===0?20:12,r0=R-154,r1=r0-len,x0=C.x+Math.cos(a)*r0,y0=C.y+Math.sin(a)*r0,x1=C.x+Math.cos(a)*r1,y1=C.y+Math.sin(a)*r1;
 ctx.strokeStyle=n%10===0?'rgba(236,240,243,.95)':'rgba(214,220,226,.7)';ctx.lineWidth=u*(n%10===0?2.6:1.6);ctx.beginPath();ctx.moveTo(X(x0),Y(y0));ctx.lineTo(X(x1),Y(y1));ctx.stroke();
 if(n%10===0){const rt=R-206,xt=C.x+Math.cos(a)*rt,yt=C.y+Math.sin(a)*rt;ctx.save();ctx.translate(X(xt),Y(yt));ctx.rotate(a+Math.PI/2);ctx.fillStyle='rgba(236,240,243,.92)';ctx.fillText(String(n),0,0);ctx.restore()}}
/* Markierung oben auf der Zarge */
ctx.fillStyle='#b8553a';ctx.beginPath();ctx.moveTo(X(C.x),Y(C.y-R+4));ctx.lineTo(X(C.x-9),Y(C.y-R-14));ctx.lineTo(X(C.x+9),Y(C.y-R-14));ctx.closePath();ctx.fill();
/* Weiche Vignette und feine Körnung */
let g=ctx.createRadialGradient(X(800),Y(380),X(380),X(800),Y(450),X(1150));g.addColorStop(0,'rgba(30,40,50,0)');g.addColorStop(1,'rgba(30,40,50,.16)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
const out=ctx.getImageData(0,0,W,H),q=out.data;for(let k=0;k<q.length;k+=4){const v=(rnd()-.5)*6;q[k]+=v;q[k+1]+=v;q[k+2]+=v}ctx.putImageData(out,0,0);
window.sceneDataURL=canvas.toDataURL('image/jpeg',quality);window.rendered=true;
</script>
