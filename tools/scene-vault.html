<!doctype html>
<meta charset="utf-8">
<title>Motiv: Stollen</title>
<!-- Prozedural erzeugtes Kapitelmotiv „bewahren“: der Bogen eines Stollenportals im Fels auf Spitzbergen – kalter Himmel, verschneite Felswand, Betonportal, dahinter zurückweichende Ringe mit einem warmen Licht in der Tiefe, Schnee am Boden. Parameter: ?seed=7&scale=2&q=.84. Rendern: node tools/render-scene.mjs vault -->
<style>html,body{margin:0;background:#000}canvas{display:block;max-width:100vw;height:auto}</style>
<canvas id="c"></canvas>
<script>
const params=new URLSearchParams(location.search),seed=+params.get('seed')||7,scale=+params.get('scale')||2,quality=+params.get('q')||.84;
const W=1600*scale,H=900*scale,u=scale,canvas=document.getElementById('c');canvas.width=W;canvas.height=H;const ctx=canvas.getContext('2d');
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry32(seed),range=(a,b)=>a+(b-a)*rnd(),X=x=>x*u,Y=y=>y*u,TAU=Math.PI*2;
const C={x:800,y:1062},R=470,PORTAL=44,RIDGE=530;
/* 1 · Kalter Himmel mit sehr zarten Lichtschleiern */
let g=ctx.createLinearGradient(0,0,0,Y(RIDGE));g.addColorStop(0,'#e6ecf0');g.addColorStop(.6,'#d3dde4');g.addColorStop(1,'#c3cfd8');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
for(let i=0;i<7;i++){const y=range(40,420),h=range(30,90),x0=range(-200,600),x1=range(1000,1800);const lg=ctx.createLinearGradient(X(x0),0,X(x1),0);lg.addColorStop(0,'rgba(255,255,255,0)');lg.addColorStop(.5,`rgba(255,255,255,${range(.12,.3)})`);lg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=lg;ctx.beginPath();ctx.ellipse(X((x0+x1)/2),Y(y),X((x1-x0)/2),Y(h/2),0,0,TAU);ctx.fill()}
/* 2 · Felswand mit weichem Grat und Schneeauflage */
const ridge=x=>RIDGE+Math.sin(x*.004)*14+Math.sin(x*.013+2)*7+Math.sin(x*.031)*3;
ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(0,Y(ridge(0)));for(let x=0;x<=1600;x+=8)ctx.lineTo(X(x),Y(ridge(x)));ctx.lineTo(W,H);ctx.closePath();
g=ctx.createLinearGradient(0,Y(RIDGE),0,H);g.addColorStop(0,'#3a4550');g.addColorStop(.5,'#2b343d');g.addColorStop(1,'#1f272e');ctx.fillStyle=g;ctx.fill();
ctx.save();ctx.clip();
ctx.strokeStyle='rgba(15,20,25,.35)';for(let i=0;i<420;i++){const x=range(0,1600),y=range(RIDGE,900),l=range(20,140),a=range(-.4,.4);ctx.lineWidth=u*range(.8,2.4);ctx.beginPath();ctx.moveTo(X(x),Y(y));ctx.lineTo(X(x+Math.cos(a)*l),Y(y+Math.sin(a)*l));ctx.stroke()}
ctx.strokeStyle='rgba(190,205,215,.16)';for(let i=0;i<260;i++){const x=range(0,1600),y=range(RIDGE,900),l=range(20,110),a=range(-.3,.3);ctx.lineWidth=u*range(.6,1.6);ctx.beginPath();ctx.moveTo(X(x),Y(y));ctx.lineTo(X(x+Math.cos(a)*l),Y(y+Math.sin(a)*l));ctx.stroke()}
for(let i=0;i<9;i++){const x=range(0,1600),y=range(RIDGE+40,900),r=range(120,320);const rg=ctx.createRadialGradient(X(x),Y(y),0,X(x),Y(y),X(r));rg.addColorStop(0,i%3?'rgba(10,14,18,.28)':'rgba(120,135,148,.14)');rg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=rg;ctx.fillRect(0,0,W,H)}
const depth=x=>20+8*Math.sin(x*.021)+6*Math.sin(x*.047+1)+4*Math.sin(x*.11+2);
for(let x=0;x<=1600;x+=2){const y=ridge(x),d=depth(x);const lg=ctx.createLinearGradient(0,Y(y),0,Y(y+d));lg.addColorStop(0,'rgba(242,246,249,.97)');lg.addColorStop(.45,'rgba(242,246,249,.8)');lg.addColorStop(1,'rgba(242,246,249,0)');ctx.fillStyle=lg;ctx.fillRect(X(x),Y(y-1),X(2.2),Y(d+1))}
ctx.restore();
for(let x=0;x<=1600;x+=2){const y=ridge(x);const lg=ctx.createLinearGradient(0,Y(y-14),0,Y(y));lg.addColorStop(0,'rgba(255,255,255,0)');lg.addColorStop(1,'rgba(255,255,255,.6)');ctx.fillStyle=lg;ctx.fillRect(X(x),Y(y-14),X(2.2),Y(14))}
/* 3 · Portal aus Beton, dahinter zurückweichende Ringe und ein warmes Licht in der Tiefe */
const portal=(r,style)=>{ctx.beginPath();ctx.arc(X(C.x),Y(C.y),X(r),Math.PI,TAU);ctx.lineTo(X(C.x+r),H);ctx.lineTo(X(C.x-r),H);ctx.closePath();ctx.fillStyle=style;ctx.fill()};
g=ctx.createLinearGradient(X(C.x-R-PORTAL),0,X(C.x+R+PORTAL),0);g.addColorStop(0,'#aeb8bf');g.addColorStop(.5,'#c9d2d7');g.addColorStop(1,'#a4aeb5');portal(R+PORTAL,g);
ctx.fillStyle='rgba(20,28,34,.35)';for(let i=0;i<1400;i++){const a=range(Math.PI,TAU),r=range(R+4,R+PORTAL-3);ctx.fillRect(X(C.x+Math.cos(a)*r),Y(C.y+Math.sin(a)*r),u*1.4,u*1.4)}
portal(R,'#0e1418');
ctx.save();ctx.beginPath();ctx.arc(X(C.x),Y(C.y),X(R),Math.PI,TAU);ctx.lineTo(X(C.x+R),H);ctx.lineTo(X(C.x-R),H);ctx.closePath();ctx.clip();
for(let i=0;i<16;i++){const k=Math.pow(.9,i),r=R*k,cy=C.y-(R-r)*.12,t=i/15;ctx.beginPath();ctx.arc(X(C.x),Y(cy),X(r),Math.PI*.98,TAU*1.01);ctx.lineWidth=u*(3.2-2*t);ctx.strokeStyle=`rgba(${Math.round(150-90*t)},${Math.round(170-100*t)},${Math.round(185-110*t)},${.55-.3*t})`;ctx.stroke()}
g=ctx.createRadialGradient(X(C.x),Y(C.y-120),0,X(C.x),Y(C.y-120),X(150));g.addColorStop(0,'rgba(255,214,150,.9)');g.addColorStop(.3,'rgba(255,190,120,.35)');g.addColorStop(1,'rgba(255,170,100,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
g=ctx.createLinearGradient(0,Y(C.y-R),0,H);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(200,215,225,.22)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.restore();
ctx.beginPath();ctx.arc(X(C.x),Y(C.y),X(R+1),Math.PI,TAU);ctx.lineWidth=u*3;ctx.strokeStyle='rgba(235,240,244,.55)';ctx.stroke();
ctx.beginPath();ctx.arc(X(C.x),Y(C.y),X(R+PORTAL-1),Math.PI,TAU);ctx.lineWidth=u*2;ctx.strokeStyle='rgba(20,28,34,.45)';ctx.stroke();
/* 4 · Schnee am Boden mit blauem Schatten vor dem Portal, feine Flocken in der Luft */
g=ctx.createLinearGradient(0,Y(846),0,H);g.addColorStop(0,'rgba(236,241,244,0)');g.addColorStop(.35,'rgba(236,241,244,.98)');g.addColorStop(1,'#e3eaee');ctx.fillStyle=g;ctx.fillRect(0,Y(846),W,Y(54));
g=ctx.createRadialGradient(X(800),Y(900),X(60),X(800),Y(900),X(520));g.addColorStop(0,'rgba(120,145,165,.5)');g.addColorStop(1,'rgba(120,145,165,0)');ctx.fillStyle=g;ctx.fillRect(0,Y(860),W,Y(40));
ctx.fillStyle='rgba(255,255,255,.75)';for(let i=0;i<340;i++){const y=range(0,880);ctx.beginPath();ctx.arc(X(range(0,1600)),Y(y),X(range(.6,2.2)),0,TAU);ctx.fill()}
/* 5 · Vignette und Körnung */
g=ctx.createRadialGradient(X(800),Y(450),X(450),X(800),Y(450),X(1150));g.addColorStop(0,'rgba(20,30,40,0)');g.addColorStop(1,'rgba(20,30,40,.18)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
const img=ctx.getImageData(0,0,W,H),px=img.data;for(let i=0;i<px.length;i+=4){const v=(rnd()-.5)*8;px[i]+=v;px[i+1]+=v;px[i+2]+=v}ctx.putImageData(img,0,0);
window.sceneDataURL=canvas.toDataURL('image/jpeg',quality);window.rendered=true;
</script>
