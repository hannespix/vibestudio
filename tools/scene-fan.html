<!doctype html>
<meta charset="utf-8">
<title>Motiv: Materialfächer</title>
<!-- Prozedural erzeugtes Kapitelmotiv „fächer“: ein aufgefächerter Materialfächer – Eiche, Nussbaum, Beton, Messing, Stahl, Leinen, Terrakotta, Filz, Acryl, Kork, Marmor, Glas, Kupfer, Travertin –, dessen Enden einen Bogen beschreiben. Parameter: ?seed=11&scale=2&q=.84. Rendern: node tools/render-scene.mjs fan -->
<style>html,body{margin:0;background:#000}canvas{display:block;max-width:100vw;height:auto}</style>
<canvas id="c"></canvas>
<script>
const params=new URLSearchParams(location.search),seed=+params.get('seed')||11,scale=+params.get('scale')||2,quality=+params.get('q')||.84;
const W=1600*scale,H=900*scale,u=scale,canvas=document.getElementById('c');canvas.width=W;canvas.height=H;const ctx=canvas.getContext('2d');
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry32(seed),range=(a,b)=>a+(b-a)*rnd(),X=x=>x*u,Y=y=>y*u,TAU=Math.PI*2;
const PIV={x:800,y:1170},L=600,SW=92,RAD=15;
/* 1 · Hintergrund: warmes Grau, weicher Schatten unter dem Fächer */
let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#e9e2d5');g.addColorStop(1,'#d6cdbd');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
g=ctx.createRadialGradient(X(800),Y(900),X(100),X(800),Y(900),X(700));g.addColorStop(0,'rgba(60,45,30,.22)');g.addColorStop(1,'rgba(60,45,30,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
/* 2 · Materialien mit kleinen Texturen */
const rr=(x,y,w,h,r)=>{ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()};
const grain=(colour,alpha,count,wobble)=>{ctx.strokeStyle=`rgba(${colour},${alpha})`;ctx.lineWidth=u*.9;for(let i=0;i<count;i++){const x=range(-SW/2+4,SW/2-4);ctx.beginPath();ctx.moveTo(X(x),Y(-L+6));for(let y=-L+6;y<-4;y+=24)ctx.lineTo(X(x+Math.sin(y*.02+i)*wobble),Y(y));ctx.stroke()}};
const speck=(colour,alpha,count,size)=>{ctx.fillStyle=`rgba(${colour},${alpha})`;for(let i=0;i<count;i++){ctx.beginPath();ctx.arc(X(range(-SW/2+3,SW/2-3)),Y(range(-L+4,-4)),X(range(.5,size)),0,TAU);ctx.fill()}};
const weave=(colour,alpha)=>{ctx.strokeStyle=`rgba(${colour},${alpha})`;ctx.lineWidth=u*.7;for(let y=-L;y<0;y+=5){ctx.beginPath();ctx.moveTo(X(-SW/2),Y(y));ctx.lineTo(X(SW/2),Y(y));ctx.stroke()}for(let x=-SW/2;x<SW/2;x+=5){ctx.beginPath();ctx.moveTo(X(x),Y(-L));ctx.lineTo(X(x),Y(0));ctx.stroke()}};
const brushed=(colour,alpha)=>{ctx.strokeStyle=`rgba(${colour},${alpha})`;ctx.lineWidth=u*.8;for(let y=-L+2;y<0;y+=3){ctx.beginPath();ctx.moveTo(X(-SW/2),Y(y));ctx.lineTo(X(SW/2),Y(y+range(-1,1)));ctx.stroke()}};
const veins=(colour,alpha)=>{ctx.strokeStyle=`rgba(${colour},${alpha})`;ctx.lineWidth=u*1.4;for(let i=0;i<4;i++){ctx.beginPath();let x=range(-SW/2,SW/2),y=-L;ctx.moveTo(X(x),Y(y));while(y<0){y+=range(30,80);x+=range(-22,22);ctx.lineTo(X(x),Y(y))}ctx.stroke()}};
const metal=(a,b,c)=>{const lg=ctx.createLinearGradient(X(-SW/2),0,X(SW/2),0);lg.addColorStop(0,a);lg.addColorStop(.45,b);lg.addColorStop(1,c);return lg};
const M=[
 {f:'#c9a878',t:()=>grain('120,80,40',.28,9,3)},{f:'#2e3a4a',t:()=>speck('255,255,255',.08,700,1.1)},{f:'#9c9a93',t:()=>{speck('60,60,60',.25,260,1.6);speck('255,255,255',.3,120,1.2)}},
 {f:()=>metal('#a37f4c','#dcbd7c','#b08c56'),t:()=>brushed('255,255,255',.16)},{f:'#d9cfbb',t:()=>weave('120,100,70',.16)},{f:'#6b4a33',t:()=>grain('35,20,10',.35,8,4)},
 {f:'#f2efe9',t:()=>{ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillRect(X(-SW/2+10),Y(-L+10),X(9),Y(L-20))}},{f:'#b5623f',t:()=>speck('80,30,15',.2,220,1.3)},{f:'#e8e3dc',t:()=>veins('120,118,116',.4)},
 {f:'#8a9a86',t:()=>weave('40,60,45',.16)},{f:()=>metal('#8f5238','#d08a66','#9a5e42'),t:()=>brushed('255,230,210',.14)},{f:'#c99b6a',t:()=>speck('90,55,25',.3,420,1.4)},
 {f:'#2b2b2b',t:()=>brushed('255,255,255',.09)},{f:'rgba(190,208,210,.82)',t:()=>{ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(X(-SW/2+8),Y(-L+8),X(7),Y(L-16))}},{f:'#d8cbb4',t:()=>{ctx.fillStyle='rgba(120,100,80,.25)';for(let i=0;i<60;i++){ctx.beginPath();ctx.ellipse(X(range(-SW/2+4,SW/2-4)),Y(range(-L+4,-4)),X(range(2,7)),X(range(.6,1.6)),0,0,TAU);ctx.fill()}}}
];
/* 3 · Auffächern: Enden der Muster liegen auf einem Bogen um den Drehpunkt */
const n=M.length,spread=110;
for(let i=0;i<n;i++){const a=(-spread/2+i*spread/(n-1))*Math.PI/180,m=M[i];ctx.save();ctx.translate(X(PIV.x),Y(PIV.y));ctx.rotate(a);
 ctx.shadowColor='rgba(40,30,20,.35)';ctx.shadowBlur=u*22;ctx.shadowOffsetX=-u*8;ctx.shadowOffsetY=u*4;rr(X(-SW/2),Y(-L),X(SW),Y(L),X(RAD));ctx.fillStyle=typeof m.f==='function'?m.f():m.f;ctx.fill();ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;
 ctx.save();rr(X(-SW/2),Y(-L),X(SW),Y(L),X(RAD));ctx.clip();m.t();
 ctx.fillStyle='rgba(255,255,255,.58)';ctx.fillRect(X(-SW/2),Y(-L),X(SW),Y(34));ctx.fillStyle='rgba(60,50,40,.55)';ctx.fillRect(X(-SW/2+12),Y(-L+15),X(range(28,50)),Y(4));ctx.restore();
 ctx.beginPath();ctx.arc(0,Y(-38),X(7),0,TAU);ctx.fillStyle='#3a3530';ctx.fill();ctx.beginPath();ctx.arc(-X(2),Y(-40),X(2.5),0,TAU);ctx.fillStyle='rgba(255,255,255,.55)';ctx.fill();
 ctx.restore()}
/* 4 · Vignette und Körnung */
g=ctx.createRadialGradient(X(800),Y(450),X(420),X(800),Y(450),X(1150));g.addColorStop(0,'rgba(60,45,30,0)');g.addColorStop(1,'rgba(60,45,30,.2)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
const img=ctx.getImageData(0,0,W,H),px=img.data;for(let i=0;i<px.length;i+=4){const v=(rnd()-.5)*8;px[i]+=v;px[i+1]+=v;px[i+2]+=v}ctx.putImageData(img,0,0);
window.sceneDataURL=canvas.toDataURL('image/jpeg',quality);window.rendered=true;
</script>
