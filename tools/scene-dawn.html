<!doctype html>
<meta charset="utf-8">
<title>Motiv: Morgenlicht über dem Horizont</title>
<!-- Prozedural erzeugtes Kapitelmotiv für „Ermöglichen“: halbe Sonnenscheibe am Horizont, Wolken, Dunstschleier, fraktale Hügelketten. Parameter: ?seed=5&scale=2&q=.84. Rendern: node tools/render-scene.mjs dawn -->
<style>html,body{margin:0;background:#000}canvas{display:block;max-width:100vw;height:auto}</style>
<canvas id="c"></canvas>
<script>
const params=new URLSearchParams(location.search),seed=+params.get('seed')||5,scale=+params.get('scale')||2,quality=+params.get('q')||.84;
const W=1600*scale,H=900*scale,u=scale,canvas=document.getElementById('c');canvas.width=W;canvas.height=H;const ctx=canvas.getContext('2d');
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry32(seed),range=(a,b)=>a+(b-a)*rnd(),gauss=()=>{let s=0;for(let i=0;i<6;i++)s+=rnd();return(s-3)/.7071};
const X=x=>x*u,Y=y=>y*u,SUN={x:800,y:800,r:275};
/* Eindimensionales Wertrauschen mit Oktaven für Bergkämme und Wolkenränder */
function valueNoise(){const table=Array.from({length:512},()=>rnd());return(x,octaves=5,gain=.5)=>{let sum=0,amp=1,freq=1,norm=0;for(let o=0;o<octaves;o++){const p=x*freq,i=Math.floor(p),f=p-i,s=f*f*(3-2*f),a=table[(i%512+512)%512],b=table[((i+1)%512+512)%512];sum+=(a+(b-a)*s)*amp;norm+=amp;amp*=gain;freq*=2.03}return sum/norm}}
const soft=(x,y,r,colour,alpha,inner=.35)=>{const g=ctx.createRadialGradient(X(x),Y(y),0,X(x),Y(y),X(r));g.addColorStop(0,`rgba(${colour},${alpha})`);g.addColorStop(inner,`rgba(${colour},${alpha*.7})`);g.addColorStop(1,`rgba(${colour},0)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(X(x),Y(y),X(r),0,Math.PI*2);ctx.fill()};
/* 1 · Himmel: Creme oben, Rosé, dann Pfirsich und Bernstein zum Horizont, links kühler */
let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#e6dfd2');g.addColorStop(.35,'#eddcc6');g.addColorStop(.58,'#f0cfae');g.addColorStop(.74,'#efb07a');g.addColorStop(.88,'#e4904f');g.addColorStop(1,'#c56f3a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
g=ctx.createLinearGradient(0,Y(420),0,Y(720));g.addColorStop(0,'rgba(222,150,150,0)');g.addColorStop(.5,'rgba(220,140,140,.22)');g.addColorStop(1,'rgba(222,150,150,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
g=ctx.createLinearGradient(0,0,W,0);g.addColorStop(0,'rgba(176,190,212,.22)');g.addColorStop(.5,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(255,180,110,.14)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
/* 2 · Korona und Strahlen */
g=ctx.createRadialGradient(X(SUN.x),Y(SUN.y),X(SUN.r*.5),X(SUN.x),Y(SUN.y),X(820));g.addColorStop(0,'rgba(255,214,150,.5)');g.addColorStop(.28,'rgba(255,204,138,.38)');g.addColorStop(.62,'rgba(255,196,136,.15)');g.addColorStop(1,'rgba(255,196,136,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
for(let i=0;i<26;i++){const a=-Math.PI/2+gauss()*.6,w=range(.01,.045),len=range(600,1200),alpha=range(.05,.15);g=ctx.createLinearGradient(X(SUN.x),Y(SUN.y),X(SUN.x+Math.cos(a)*len),Y(SUN.y+Math.sin(a)*len));g.addColorStop(0,'rgba(255,240,214,0)');g.addColorStop(.2,`rgba(255,240,214,${alpha})`);g.addColorStop(1,'rgba(255,240,214,0)');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(X(SUN.x),Y(SUN.y));ctx.lineTo(X(SUN.x+Math.cos(a-w)*len),Y(SUN.y+Math.sin(a-w)*len));ctx.lineTo(X(SUN.x+Math.cos(a+w)*len),Y(SUN.y+Math.sin(a+w)*len));ctx.closePath();ctx.fill()}
/* 3 · Wolken: von unten warm beleuchtet, oben rauchig, aus vielen weichen Flecken */
function cloud(cx,cy,w,h,density){const n=valueNoise();for(let i=0;i<density;i++){const t=range(-1,1),x=cx+t*w*.5+gauss()*w*.08,y=cy+gauss()*h*.42*(1-.5*Math.abs(t)),r=range(h*.35,h*.9)*(1-.35*Math.abs(t)),below=(y-cy)/h+.5,lit=Math.max(0,Math.min(1,below+n(i*.7)*.4-.2));soft(x,y,r,lit>.5?'255,236,212':'196,150,120',(lit>.5?.13:.09)*range(.6,1.2),.5)}for(let i=0;i<density*.5;i++){const t=range(-1,1),x=cx+t*w*.5,y=cy+h*.28+gauss()*h*.12,r=range(h*.25,h*.6);soft(x,y,r,'255,224,190',.12*range(.5,1),.5)}}
cloud(300,190,760,110,150);cloud(1250,150,620,90,120);cloud(1420,330,420,60,80);cloud(140,620,540,50,90);cloud(1480,600,520,54,90);cloud(560,668,700,44,110);cloud(1120,690,760,40,110);
/* 4 · Sonnenscheibe: der Halbkreis über dem Horizont */
ctx.save();ctx.shadowColor='rgba(255,226,186,.9)';ctx.shadowBlur=X(22);g=ctx.createRadialGradient(X(SUN.x),Y(SUN.y-70),0,X(SUN.x),Y(SUN.y),X(SUN.r));g.addColorStop(0,'#fffdf7');g.addColorStop(.5,'#fff0d2');g.addColorStop(.88,'#ffdfae');g.addColorStop(1,'#ffd7a0');ctx.fillStyle=g;ctx.beginPath();ctx.arc(X(SUN.x),Y(SUN.y),X(SUN.r),Math.PI,0);ctx.closePath();ctx.fill();ctx.restore();
/* 5 · Dunstschleier vor Sonne und Horizont: wellige, unterschiedlich dichte Wische statt gerader Streifen */
function wisp(y,left,right,thickness,colour,alpha){const n=valueNoise(),steps=Math.ceil((right-left)/14);for(let i=0;i<=steps;i++){const t=i/steps,x=left+(right-left)*t,edge=Math.sin(Math.PI*t),th=thickness*(.7+.8*n(i*.35))*Math.max(.35,edge),yy=y+(n(i*.12+7)-.5)*thickness*3;ctx.save();ctx.translate(X(x),Y(yy));ctx.scale(3.6,1);soft(0,0,th,colour,alpha*edge*range(.7,1),.4);ctx.restore()}}
for(let i=0;i<16;i++){const y=800-235*Math.pow(rnd(),1.6),len=range(300,1400),cx=800+gauss()*420,light=rnd()<.42;wisp(y,cx-len/2,cx+len/2,range(6,18),light?'255,244,226':'206,140,96',light?range(.3,.6):range(.16,.38))}
/* 6 · Hügelketten: fraktale Kämme, fern dunstig bis nah dunkel, Kantenlicht nahe der Sonne, Textur */
function ridge(base,amp,detail){const n=valueNoise(),k=range(.003,.006),o=range(0,50);return x=>{const d=Math.min(1,Math.abs(x-800)/720);return base+(n(x*k+o,6,.55)-.5)*2*amp*(.3+.7*d)+(n(x*.06+o,3,.5)-.5)*detail}}
const layers=[{f:ridge(800,62,3),top:'#c9a382',bottom:'#a68266',alpha:.62,rim:.5,texture:.04},{f:ridge(838,58,6),top:'#775e4c',bottom:'#4b3a2e',alpha:.93,rim:.36,texture:.07},{f:ridge(868,40,10),top:'#2c241d',bottom:'#16110e',alpha:1,rim:.2,texture:.1}];
for(const layer of layers){g=ctx.createLinearGradient(0,Y(760),0,H);g.addColorStop(0,layer.top);g.addColorStop(1,layer.bottom);ctx.globalAlpha=layer.alpha;ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=1600;x+=2)ctx.lineTo(X(x),Y(layer.f(x)));ctx.lineTo(W,H);ctx.closePath();ctx.fill();ctx.globalAlpha=1;
 ctx.save();ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=1600;x+=2)ctx.lineTo(X(x),Y(layer.f(x)));ctx.lineTo(W,H);ctx.closePath();ctx.clip();for(let i=0;i<2600;i++){const x=range(0,1600),y=range(layer.f(x),900),r=range(.8,3.2);soft(x,y,r,(layer.rim>.3&&rnd()<.12)?'255,220,180':'14,9,6',layer.texture*range(.4,1.6),.5)}ctx.restore();
 for(let x=0;x<1600;x+=2){const a=layer.rim*Math.max(0,1-Math.abs(x+1-800)/470);if(a<=0)continue;ctx.strokeStyle=`rgba(255,226,182,${a})`;ctx.lineWidth=X(1.8);ctx.beginPath();ctx.moveTo(X(x),Y(layer.f(x)));ctx.lineTo(X(x+2),Y(layer.f(x+2)));ctx.stroke()}}
/* 7 · Talnebel und Lichtreflexe */
g=ctx.createLinearGradient(0,Y(765),0,Y(900));g.addColorStop(0,'rgba(255,216,172,.34)');g.addColorStop(.45,'rgba(255,216,172,.1)');g.addColorStop(1,'rgba(255,216,172,0)');ctx.fillStyle=g;ctx.fillRect(0,Y(765),W,Y(135));
for(const[t,r,a]of[[.34,58,.06],[.52,26,.08],[.78,96,.045],[1.06,40,.05]])soft(800,800-t*620,r,'255,224,190',a,.8);
/* 8 · Vignette und Körnung */
g=ctx.createRadialGradient(X(800),Y(520),X(380),X(800),Y(520),X(1180));g.addColorStop(0,'rgba(70,45,30,0)');g.addColorStop(1,'rgba(70,45,30,.26)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
const img=ctx.getImageData(0,0,W,H),px=img.data;for(let i=0;i<px.length;i+=4){const n=(rnd()-.5)*9;px[i]+=n;px[i+1]+=n;px[i+2]+=n}ctx.putImageData(img,0,0);
window.sceneDataURL=canvas.toDataURL('image/jpeg',quality);window.rendered=true;
</script>
