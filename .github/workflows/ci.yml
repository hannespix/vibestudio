name: Prüfung

# Öffnet die Präsentation headless in Chromium, prüft Editorfunktionen und die gebaute Ein-Datei-Fassung.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ein-Datei-Fassung bauen
        run: node build.mjs
      - name: Playwright installieren
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1 jsqr@1.4.0
          npx playwright install --with-deps chromium
      - name: Smoke-Test
        run: node tools/smoke-test.mjs
      - name: Screenshots sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: dist/smoke/
          if-no-files-found: ignore
